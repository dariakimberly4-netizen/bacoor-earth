<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bacoor Earth 3D</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>*{box-sizing:border-box}html,body,#earth{width:100%;height:100%;margin:0;overflow:hidden;background:#000;font-family:system-ui;color:#fff}.cesium-viewer-bottom,.cesium-viewer-toolbar,.cesium-viewer-animationContainer,.cesium-viewer-timelineContainer{display:none!important}.brand{position:fixed;z-index:5;top:18px;left:16px;padding:10px 13px;background:#020711d9;border:1px solid #ffffff2b;border-radius:14px;font-size:11px;letter-spacing:.12em;font-weight:800;text-shadow:0 2px 7px #000}.brand b{display:block;font-size:23px;letter-spacing:.03em}.stage{position:fixed;z-index:5;top:20px;right:14px;background:#020711d9;border:1px solid #ffffff2b;border-radius:999px;padding:9px 12px;font-size:10px;font-weight:800}.hero{position:fixed;z-index:4;left:0;right:0;bottom:7vh;text-align:center;padding:20px;text-shadow:0 3px 14px #000}.hero.hide{display:none}.hero h1{font-size:clamp(44px,12vw,78px);margin:0}.hero p{max-width:540px;margin:7px auto 18px}.primary,button{min-height:48px;border-radius:999px;border:1px solid #ffffff4a;padding:11px 15px;font-weight:800;background:#07131ee8;color:#fff}.primary{background:#fff;color:#07131e}.panel{position:fixed;z-index:6;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));max-width:760px;margin:auto;background:#020a12e9;border:1px solid #ffffff2d;border-radius:22px;padding:14px;backdrop-filter:blur(15px);transform:translateY(130%);transition:.4s}.panel.show{transform:none}.panel h2{margin:0 0 3px;font-size:20px}.panel p{margin:0 0 10px;opacity:.8;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grid button{border-radius:13px;font-size:12px;min-height:42px;padding:8px}.grid button:last-child{grid-column:1/-1}@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}.grid button:last-child{grid-column:auto}}</style></head>
<body><div id="earth"></div><div class="brand">CULTURAL HERITAGE EXPLORER<b>BACOOR EARTH</b></div><div class="stage" id="stage">EARTH</div>
<section class="hero" id="hero"><h1>Discover Bacoor.</h1><p>A true 3D globe journey from Earth to the Philippines, Cavite and Bacoor using real satellite imagery.</p><button class="primary" id="enter">ENTER BACOOR ↓</button></section>
<section class="panel" id="panel"><h2 id="title">Bacoor, Cavite</h2><p id="desc">Choose a landmark to fly closer.</p><div class="grid" id="places"></div></section>
<script>
const viewer=new Cesium.Viewer("earth",{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,selectionIndicator:false,terrainProvider:new Cesium.EllipsoidTerrainProvider()});
viewer.imageryLayers.removeAll();
(async()=>{try{const p=await Cesium.ArcGisMapServerImageryProvider.fromUrl("https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer");viewer.imageryLayers.addImageryProvider(p)}catch(e){console.error(e)}})();
viewer.scene.globe.enableLighting=true;viewer.scene.skyAtmosphere.show=true;viewer.scene.fog.enabled=true;
viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(121,12,18500000)});
const sites=[{name:"St. Michael Parish",lat:14.4597,lng:120.9598},{name:"Zapote Bridge",lat:14.4503,lng:120.9827},{name:"Bahay na Tisa",lat:14.459,lng:120.9608},{name:"Padre Gomes Plaza",lat:14.4594,lng:120.96},{name:"Molino Dam",lat:14.3908,lng:120.9944}];
sites.forEach((s,i)=>{viewer.entities.add({position:Cesium.Cartesian3.fromDegrees(s.lng,s.lat),point:{pixelSize:11,color:Cesium.Color.GOLD,outlineColor:Cesium.Color.WHITE,outlineWidth:2}});const b=document.createElement("button");b.textContent=(i+1)+" · "+s.name;b.onclick=()=>go(s);places.appendChild(b)});
function fly(lng,lat,height,duration,pitch=-55){return viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lng,lat,height),orientation:{heading:0,pitch:Cesium.Math.toRadians(pitch),roll:0},duration})}
function go(s){stage.textContent=s.name.toUpperCase();title.textContent=s.name;desc.textContent="Real satellite view around "+s.name+".";fly(s.lng,s.lat,700,2.3,-38)}
enter.onclick=()=>{hero.classList.add("hide");stage.textContent="PHILIPPINES";fly(121.8,12.8,1800000,2.2,-90);setTimeout(()=>{stage.textContent="CAVITE";fly(120.93,14.28,130000,2.2,-70)},2300);setTimeout(()=>{stage.textContent="BACOOR";fly(120.97,14.43,14000,2.4,-55)},4600);setTimeout(()=>{stage.textContent="BACOOR · 3D SATELLITE";panel.classList.add("show")},7100)};
</script></body></html>
