<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bacoor Earth</title><script src="https://unpkg.com/globe.gl"></script><style>*{box-sizing:border-box}html,body,#globe{margin:0;width:100%;height:100%;overflow:hidden;background:#020711;font-family:system-ui;color:#fff}.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 25%,#000a 100%)}.brand{position:fixed;top:24px;left:22px;z-index:3;letter-spacing:.15em;font-size:11px}.brand b{display:block;font-size:20px}.hero{position:fixed;left:0;right:0;bottom:8vh;text-align:center;z-index:3;padding:20px}.hero h1{font-size:clamp(42px,10vw,84px);margin:0}.hero p{opacity:.76;max-width:560px;margin:8px auto 22px}button{border:1px solid #ffffff55;background:#06121dcc;color:white;border-radius:999px;padding:14px 20px;font-weight:800;min-height:50px}.primary{background:#fff;color:#07121d}.hide{opacity:0;pointer-events:none;transition:.5s}#panel{position:fixed;z-index:4;left:14px;right:14px;bottom:14px;max-width:720px;margin:auto;padding:17px;border:1px solid #ffffff2e;border-radius:24px;background:#020a12dc;backdrop-filter:blur(16px);transform:translateY(140%);transition:.5s}#panel.show{transform:none}#panel h2{margin:0 0 5px}#panel p{opacity:.75;margin:0 0 12px}.row{display:flex;gap:8px;overflow:auto}.row button{white-space:nowrap;padding:10px 14px}</style></head><body><div id="globe"></div><div class="shade"></div><div class="brand">CULTURAL HERITAGE EXPLORER<b>BACOOR EARTH</b></div><section class="hero" id="hero"><h1>Discover Bacoor.</h1><p>Begin from Earth, descend into the Philippines, and explore Bacoor, Cavite.</p><button class="primary" id="enter">ENTER BACOOR ↓</button></section><section id="panel"><h2 id="title">Bacoor, Cavite</h2><p id="desc">Choose a landmark and fly across Bacoor.</p><div class="row" id="places"></div></section><script>const sites=[{name:"St. Michael the Archangel Parish",lat:14.4597,lng:120.9598,desc:"Historic parish in Bacoor's old town."},{name:"Zapote Bridge",lat:14.4503,lng:120.9827,desc:"Historic bridge and heritage landmark."},{name:"Bahay na Tisa",lat:14.459,lng:120.9608,desc:"Heritage house recalling Bacoor's historic townscape."},{name:"Padre Gomes Plaza",lat:14.4594,lng:120.96,desc:"Civic heritage space in Bacoor's historic center."},{name:"Molino Dam",lat:14.3908,lng:120.9944,desc:"Historic landmark in the Molino area."}];const g=Globe()(document.getElementById("globe")).globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg").bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png").backgroundImageUrl("https://unpkg.com/three-globe/example/img/night-sky.png").pointsData([]).pointColor(()=>"#ffd66b").pointAltitude(.018).pointRadius(.24).labelsData([]).labelText("name").labelColor(()=>"#fff").labelDotRadius(.22).labelSize(1);g.controls().autoRotate=true;g.controls().autoRotateSpeed=.35;g.pointOfView({lat:15,lng:122,altitude:2.4});function fly(s){g.controls().autoRotate=false;g.pointOfView({lat:s.lat,lng:s.lng,altitude:.18},1800);title.textContent=s.name;desc.textContent=s.desc}sites.forEach((s,i)=>{let b=document.createElement("button");b.textContent=(i+1)+" · "+s.name;b.onclick=()=>fly(s);places.appendChild(b)});enter.onclick=()=>{hero.classList.add("hide");g.controls().autoRotate=false;g.pointOfView({lat:12.8,lng:121.8,altitude:1.05},1500);setTimeout(()=>g.pointOfView({lat:14.413,lng:120.97,altitude:.32},1800),1600);setTimeout(()=>{g.pointsData(sites);g.labelsData(sites);panel.classList.add("show")},3300)};g.onPointClick(fly)</script></body></html>
