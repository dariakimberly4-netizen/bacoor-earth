<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bacoor Earth Satellite</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui;background:#071018}.leaflet-control-zoom{display:none}.brand{position:fixed;z-index:900;top:14px;left:14px;right:14px;max-width:360px;padding:11px 14px;border-radius:16px;background:#06111de8;color:#fff;border:1px solid #ffffff2b;text-shadow:0 2px 8px #000;font-size:11px;letter-spacing:.11em;font-weight:800}.brand b{display:block;font-size:23px;letter-spacing:.03em}.badge{position:fixed;z-index:900;top:85px;left:14px;background:#06111de8;color:#fff;border:1px solid #ffffff2b;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800}.hero{position:fixed;z-index:850;inset:0;display:grid;place-items:end center;pointer-events:none;background:linear-gradient(transparent 45%,#000b)}.hero>div{text-align:center;color:#fff;padding:28px 18px 46px;pointer-events:auto}.hero h1{font-size:clamp(42px,12vw,76px);margin:0;text-shadow:0 3px 16px #000}.hero p{max-width:520px;margin:7px auto 18px;text-shadow:0 2px 10px #000}.hero.hide{display:none}button{border:1px solid #ffffff4a;background:#07131ee8;color:#fff;border-radius:999px;padding:12px 16px;min-height:46px;font-weight:800}.primary{background:#fff;color:#07131e}.panel{position:fixed;z-index:900;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));max-width:720px;margin:auto;background:#06111dec;color:#fff;border:1px solid #ffffff2b;border-radius:22px;padding:14px;backdrop-filter:blur(14px);transform:translateY(130%);transition:.35s}.panel.show{transform:none}.panel h2{margin:0 0 3px;font-size:20px}.panel p{margin:0 0 10px;opacity:.8;font-size:13px}.places{display:grid;grid-template-columns:1fr 1fr;gap:7px}.places button{border-radius:13px;padding:8px;font-size:12px;min-height:42px}.places button:last-child{grid-column:1/-1}.pin{background:#f4c95d;border:3px solid #fff;width:18px;height:18px;border-radius:50%;box-shadow:0 2px 9px #000}.leaflet-control-attribution{font-size:8px!important}@media(min-width:700px){.places{grid-template-columns:repeat(5,1fr)}.places button:last-child{grid-column:auto}}</style></head>
<body><div id="map"></div><div class="brand">REAL SATELLITE EXPLORER<b>BACOOR EARTH</b></div><div class="badge" id="badge">EARTH → BACOOR</div>
<section class="hero" id="hero"><div><h1>See Bacoor.</h1><p>Explore Bacoor using real satellite and aerial imagery, then jump directly to its heritage landmarks.</p><button class="primary" id="enter">ENTER BACOOR ↓</button></div></section>
<section class="panel" id="panel"><h2 id="title">Bacoor, Cavite</h2><p id="desc">Tap a landmark to zoom to its real geographic location.</p><div class="places" id="places"></div></section>
<script>
const sites=[{name:"St. Michael Parish",lat:14.4597,lng:120.9598},{name:"Zapote Bridge",lat:14.4503,lng:120.9827},{name:"Bahay na Tisa",lat:14.4590,lng:120.9608},{name:"Padre Gomes Plaza",lat:14.4594,lng:120.9600},{name:"Molino Dam",lat:14.3908,lng:120.9944}];
const map=L.map("map",{zoomControl:false,minZoom:2,maxZoom:19,worldCopyJump:true}).setView([13,122],5);
L.tileLayer("https://{s}.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{subdomains:["server","services"],maxZoom:19,attribution:"Tiles © Esri — Sources: Esri and imagery providers"}).addTo(map);
const icon=L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[18,18],iconAnchor:[9,9]});
sites.forEach((s,i)=>{const m=L.marker([s.lat,s.lng],{icon}).addTo(map);m.bindTooltip(s.name);m.on("click",()=>go(s));const b=document.createElement("button");b.textContent=(i+1)+" · "+s.name;b.onclick=()=>go(s);places.appendChild(b)});
function go(s){badge.textContent=s.name.toUpperCase();title.textContent=s.name;desc.textContent="Real satellite view around "+s.name+".";map.flyTo([s.lat,s.lng],18,{duration:2})}
enter.onclick=()=>{hero.classList.add("hide");badge.textContent="PHILIPPINES";map.flyTo([12.8,121.8],7,{duration:1.4});setTimeout(()=>{badge.textContent="CAVITE";map.flyTo([14.28,120.93],11,{duration:1.4})},1500);setTimeout(()=>{badge.textContent="BACOOR";map.flyTo([14.43,120.97],14,{duration:1.6});panel.classList.add("show")},3000)};
</script></body></html>
